<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Proxmox HomeLab network topology</title>
<desc id="desc">Internet connects through the home router to vmbr0 on the Proxmox host. Proxmox management and the Debian and pfSense virtual machines share vmbr0. Debian runs Pi-hole and Docker with Portainer and Uptime Kuma. The pfSense LAN interface connects through isolated vmbr1 to an Alpine test VM. No IP addresses are shown.</desc>
<defs><filter id="shadow" x="-10%" y="-15%" width="125%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e3a5f" flood-opacity=".12"/></filter></defs>
